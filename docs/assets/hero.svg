    <linearGradient id="accent"><stop stop-color="#94e7ca"/><stop offset="1" stop-color="#4fb4c7"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#c7eeea" stroke-opacity=".035"/></pattern>
  </defs>
